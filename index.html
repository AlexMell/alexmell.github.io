<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://alexmell.dev">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <title>AlexMell</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      text-align: center;
      animation: fadeIn 0.6s ease both;
    }

    .name {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 40%, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dot {
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #555;
      letter-spacing: 0.04em;
    }

    .link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #888;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .link:hover { color: #fff; border-color: #555; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">alexmell<span class="dot">.dev</span></div>
    <p class="subtitle">Redirecting…</p>
    <a class="link" href="https://alexmell.dev">Go now →</a>
  </div>
  <script>window.location.replace("https://alexmell.dev");</script>
</body>
</html>
