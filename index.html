<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <title>AlexMell</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 2rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: fadeIn 0.6s ease both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      letter-spacing: -0.02em;
      color: #f4f5f3;
    }

    .logo .prompt {
      color: #22c55e;
      font-weight: 700;
      margin-right: 0.4em;
    }

    .logo .muted {
      color: #777c74;
    }

    .logo .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.05em;
      background: #22c55e;
      margin-left: 0.12em;
      transform: translateY(0.12em);
      animation: am-blink 1.1s steps(1) infinite;
    }

    @keyframes am-blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #555;
      letter-spacing: 0.04em;
    }

    .links {
      list-style: none;
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.4rem;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #ccc;
      font-size: 0.95rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .link:hover {
      color: #fff;
      border-color: #6ee7f7;
      background: #141414;
      transform: translateY(-1px);
    }

    .link .arrow {
      color: #555;
      transition: color 0.2s, transform 0.2s;
    }

    .link:hover .arrow {
      color: #6ee7f7;
      transform: translateX(3px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/">
      <span class="prompt">❯</span>alexmell<span class="muted">.dev</span><span class="cursor"></span>
    </a>
    <p class="subtitle">github pages</p>
    <ul class="links">
      <li><a class="link" href="https://alexmell.dev">alexmell.dev <span class="arrow">→</span></a></li>
      <li><a class="link" href="https://worldvote.app">worldvote.app <span class="arrow">→</span></a></li>
      <li><a class="link" href="/my-data">my-data <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-js">learn-js <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-ai">learn-ai <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-nodejs">learn-nodejs <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-react">learn-react <span class="arrow">→</span></a></li>
    </ul>
  </div>
</body>
</html>
