<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <title>AlexMell</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 2rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: fadeIn 0.6s ease both;
    }

    .name {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 40%, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dot {
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #555;
      letter-spacing: 0.04em;
    }

    .links {
      list-style: none;
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.4rem;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #ccc;
      font-size: 0.95rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .link:hover {
      color: #fff;
      border-color: #6ee7f7;
      background: #141414;
      transform: translateY(-1px);
    }

    .link .arrow {
      color: #555;
      transition: color 0.2s, transform 0.2s;
    }

    .link:hover .arrow {
      color: #6ee7f7;
      transform: translateX(3px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">alexmell<span class="dot">.dev</span></div>
    <p class="subtitle">github pages</p>
    <ul class="links">
      <li><a class="link" href="https://alexmell.dev">alexmell.dev <span class="arrow">→</span></a></li>
      <li><a class="link" href="https://worldvote.app">worldvote.app <span class="arrow">→</span></a></li>
      <li><a class="link" href="/my-data">my-data <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-js">learn-js <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-ai">learn-ai <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-nodejs">learn-nodejs <span class="arrow">→</span></a></li>
      <li><a class="link" href="/learn-react">learn-react <span class="arrow">→</span></a></li>
    </ul>
  </div>
</body>
</html>
